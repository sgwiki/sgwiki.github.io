site_name: Steins;Gate 한국어 위키
site_url: https://sgwiki.github.io/
site_description: 슈타인즈 게이트 공식·팬 분석 한국어 위키

# Built with MkDocs Material

theme:
  name: material
  custom_dir: overrides
  language: ko
  font: false  # Roboto 자동 로드 비활성화 — Pretendard는 overrides/main.html extrahead에서 <link> 로드
  features:
    - content.code.copy
    # document$ 구독형 보조 UI(아마데우스 포함)를 유지한 채 본문만 전환한다.
    - navigation.instant
    - navigation.progress
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    # 야간(달빛 옥상) — 기본. 첫 방문 시 이 스킴으로 시작하고 선택은 브라우저에 저장됨.
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 주간(한낮 옥상) 모드로 전환
    # 주간(한낮 옥상) — 라이트 테마.
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: 야간(달빛 옥상) 모드로 전환

plugins:
  - search:
      lang:
        - en
        - ja  # 한국어 형태소 분석 미지원 — ja가 가장 유사한 동작
  - awesome-pages  # nav 구성은 wiki/.pages — 새 문서는 소속 디렉터리에 넣으면 자동 포함

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes  # [^1] 인라인 각주 + [^1]: 내용 하단 정의 — demun.github.io/mkdocs-tuts 가이드 참고
  - md_in_html  # <details markdown="1"> 안의 마크다운을 렌더 — 없으면 본문이 raw로 새어나간다
  - toc:
      # 기본 slugify는 ASCII 전용이라 한국어 제목이 전부 id="_2"·"_3"으로 뭉개진다.
      # 그러면 본문이 쓰는 `#관련-문서` 류 앵커가 100% 깨진다. 유니코드 slug로 고정한다.
      # 이 규칙은 scripts/wiki_link_lint.py 의 slugify()가 그대로 복제한다 — 함께 바꿀 것.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      separator: "-"
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

docs_dir: wiki
site_dir: site

# mkdocs 기본값은 깨진 앵커·인식 못 한 상대 링크를 INFO 로만 흘린다 — 빌드는 성공하고
# 목차만 조용히 죽는다. warn 으로 올려 `mkdocs build --strict`(preflight G8a)가 잡게 한다.
# absolute_links 는 info 로 남긴다 — `/maps/anime/` 는 MkDocs 밖 SPA 라우트라 정상이다.
validation:
  links:
    anchors: warn
    unrecognized_links: warn
exclude_docs: |
  _template/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sgwiki/sgwiki.github.io

extra_css:
  - assets/stylesheets/sg-theme.css

extra_javascript:
  - javascripts/worldline-map-btn.js
  - javascripts/amadeus-chat-btn.js
  - javascripts/sg-enhance.js
