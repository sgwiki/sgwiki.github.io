name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "sg-worldline-map/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: SPA 빌드 (React/Vite) ──────────────────────────────────
  # 실패해도 wiki 배포는 진행됨 (if: always()). 맵만 누락된 채 위키 정상 서빙.
  build-spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 주: 시리즈 JSON(sg-worldline-map/src/data/*.json)은 커밋된 빌드 입력이다.
      # 재생성 스크립트(scripts/generate-data.py)와 온톨로지 TTL은 public 저장소에
      # 추적되지 않으므로 CI 체크아웃에 존재하지 않는다. 데이터를 바꾸려면 dev 트리에서
      # 재생성해 커밋한다.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sg-worldline-map/package-lock.json

      - name: Install SPA deps
        working-directory: sg-worldline-map
        run: npm ci

      - name: Build SPA
        working-directory: sg-worldline-map
        run: npm run build

      - name: Package maps artifact
        run: |
          mkdir -p maps-artifact
          cp -r sg-worldline-map/dist/* maps-artifact/
          ls -la maps-artifact/

      - name: Upload maps artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-spa
          path: maps-artifact/
          retention-days: 1

  # ─── Job 2: 위키 빌드 (MkDocs) + SPA 머지 ─────────────────────────
  # SPA 빌드 성공 시 artifact를 받아 site/maps/로 복사.
  # SPA 실패 시에도 wiki은 정상 빌드/배포 (맵만 빠진 채).
  build-wiki:
    runs-on: ubuntu-latest
    needs: build-spa
    if: always()  # build-spa 실패해도 진행 — 운영 위키 무결성 보장 (PRD P1)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: (Optional) Download SPA artifact
        id: spa
        uses: actions/download-artifact@v4
        with:
          name: maps-spa
          path: maps-spa-dist
        continue-on-error: true  # build-spa 실패 시 artifact 없음 — 무시하고 wiki만 배포

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install MkDocs Material
        run: uv pip install --system mkdocs-material

      - name: Build wiki site
        run: mkdocs build

      - name: Merge SPA into site/maps/ (if artifact available)
        if: steps.spa.outcome == 'success'
        run: |
          mkdir -p site/maps
          cp -r maps-spa-dist/* site/maps/
          echo "SPA merged into site/maps/"
          ls -la site/maps/

      - name: Warn if SPA missing
        if: steps.spa.outcome != 'success'
        run: |
          echo "::warning::SPA 빌드 실패로 맵 없이 위키만 배포합니다. sg-worldline-map/ 빌드를 확인하세요."

      - name: Remove gzip-compressed sitemap (Google Search Console issue)
        run: |
          rm -f site/sitemap.xml.gz
          echo "Removed site/sitemap.xml.gz to prevent Content-Encoding issues with Google"

      # GSC가 기존 sitemap.xml에 "가져올 수 없음" 실패 기록을 캐시한 경우,
      # 새 URL로 제출하면 신규 fetch가 일어남 (John Mueller 권장 우회책)
      - name: Create sitemap alias for GSC refetch
        run: cp site/sitemap.xml site/sitemap-pages.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
